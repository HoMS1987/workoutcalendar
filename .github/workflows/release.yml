# Builds, signs and publishes the app when a GitHub release is published.
# Based on https://github.com/nextcloud/.github/blob/master/workflow-templates/appstore-build-publish.yml
# Secrets: APP_PRIVATE_KEY (key of the App Store certificate), APPSTORE_TOKEN (apps.nextcloud.com/account/token).
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish:
    name: Build, sign and publish to the App Store
    runs-on: ubuntu-latest
    env:
      APP_ID: workoutcalendar
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check that the tag matches the version in info.xml
        run: |
          version=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' appinfo/info.xml)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match info.xml version $version" >&2
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: bash scripts/package.sh

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      # occ integrity:sign-app needs a server checkout, but no installed instance.
      - name: Check out Nextcloud server for occ
        uses: actions/checkout@v7
        with:
          repository: nextcloud/server
          ref: stable33
          submodules: true
          persist-credentials: false
          path: server

      - name: Sign the app
        env:
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          key="$RUNNER_TEMP/$APP_ID.key"
          crt="$RUNNER_TEMP/$APP_ID.crt"
          printf '%s\n' "$APP_PRIVATE_KEY" > "$key"
          trap 'rm -f "$key"' EXIT
          curl -fsSL -o "$crt" "https://raw.githubusercontent.com/nextcloud/app-certificate-requests/master/$APP_ID/$APP_ID.crt"
          bash scripts/sign.sh "$key" "$crt" server

      - name: Attach the archive to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="$APP_ID-$GITHUB_REF_NAME.tar.gz"
          cp "build/artifacts/$APP_ID.tar.gz" "$RUNNER_TEMP/$asset"
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/$asset" --clobber
          echo "DOWNLOAD_URL=https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$asset" >> "$GITHUB_ENV"

      - name: Upload the release to the App Store
        env:
          APPSTORE_TOKEN: ${{ secrets.APPSTORE_TOKEN }}
        run: |
          jq -n --arg download "$DOWNLOAD_URL" --rawfile signature "build/artifacts/$APP_ID.tar.gz.sig" \
            '{download: $download, signature: $signature, nightly: false}' > "$RUNNER_TEMP/release.json"
          curl -fsS -X POST https://apps.nextcloud.com/api/v1/apps/releases \
            -H "Authorization: Token $APPSTORE_TOKEN" \
            -H 'Content-Type: application/json' \
            --data @"$RUNNER_TEMP/release.json"
