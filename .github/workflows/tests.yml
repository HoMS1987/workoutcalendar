name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer test

  integration:
    name: Integration (Nextcloud ${{ matrix.server }}, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - server: stable33
            php: '8.2'
          - server: stable34
            php: '8.4'
          - server: stable35
            php: '8.5'
    steps:
      - name: Nextcloud Server auschecken
        uses: actions/checkout@v7
        with:
          repository: nextcloud/server
          ref: ${{ matrix.server }}
          submodules: true
          path: server
      - name: App auschecken
        uses: actions/checkout@v7
        with:
          path: server/apps/workoutcalendar
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, gd, zip, curl, xml, pdo_sqlite, sqlite3, sodium, openssl, fileinfo, posix, ctype, dom, json, simplexml, xmlreader, xmlwriter, bcmath, gmp
          coverage: none
      - name: Nextcloud installieren
        working-directory: server
        run: |
          php occ maintenance:install --database sqlite --admin-user admin --admin-pass admin
          php occ app:enable workoutcalendar
      - name: Abhängigkeiten der App installieren
        working-directory: server/apps/workoutcalendar
        run: composer install --no-interaction --no-progress
      - name: Integrationstests
        working-directory: server/apps/workoutcalendar
        run: composer test:integration

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  release-archive:
    name: Release archive (package, sign with a throwaway key)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: bash scripts/package.sh
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Check out Nextcloud server for occ
        uses: actions/checkout@v7
        with:
          repository: nextcloud/server
          ref: stable33
          submodules: true
          path: server
      - name: Sign like the release workflow and verify the signature
        run: |
          openssl req -x509 -nodes -newkey rsa:4096 -days 1 -subj /CN=workoutcalendar \
            -keyout "$RUNNER_TEMP/test.key" -out "$RUNNER_TEMP/test.crt"
          bash scripts/sign.sh "$RUNNER_TEMP/test.key" "$RUNNER_TEMP/test.crt" server
          openssl x509 -pubkey -noout -in "$RUNNER_TEMP/test.crt" > "$RUNNER_TEMP/test.pub"
          base64 -d build/artifacts/workoutcalendar.tar.gz.sig > "$RUNNER_TEMP/test.sig"
          openssl dgst -sha512 -verify "$RUNNER_TEMP/test.pub" -signature "$RUNNER_TEMP/test.sig" build/artifacts/workoutcalendar.tar.gz
          tar -tzf build/artifacts/workoutcalendar.tar.gz | grep -qx 'workoutcalendar/appinfo/signature.json'
